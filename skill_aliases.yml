# Skill alias groups derived from candidate profiles
# (Yaswanth Kommineni, Likitha Lavanya Kommineni, Nistha Ghorela).
#
# Structure
#   skills:
#     <category>:
#       <canonical_skill>:
#         - alias1
#         - alias2
#         ...
#
# Matcher conventions (intended; not enforced by this file):
#   - All aliases are matched case-insensitively.
#   - Punctuation/hyphens/multiple-spaces should be normalized to a single
#     space before comparison.
#   - The canonical name is also listed inside aliases so the matcher only
#     needs to walk the aliases list.
#   - MATCH WITH WORD BOUNDARIES (regex \b...\b). Substring matching is
#     forbidden — it would let "ml" match "html", "rest" match "restore",
#     "go" match "argon", etc.
#   - Single-letter aliases (e.g. "r", "c") and standalone English-word
#     aliases (e.g. "go") are deliberately OMITTED because even with word
#     boundaries they false-positive on common JD prose like "let's go
#     build products" or "the R&D team". Use compound forms instead
#     ("go programming", "golang", "r programming", "c language").
#   - Two-letter abbreviations like "ml", "ai", "js", "ts" are KEPT because
#     word-boundary matching makes them safe (e.g. \bml\b does not match
#     "html") and they routinely appear standalone in job titles/blurbs.

