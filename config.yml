ats_platforms:
  greenhouse:
    delay_seconds: 5.0
    max_concurrency: 3
    notes: Highly stable public JSON endpoints.

  lever:
    delay_seconds: 5.0
    max_concurrency: 3
    notes: Low risk of rate limits on GET postings.

  ashby:
    delay_seconds: 10.0
    max_concurrency: 2
    notes: Targets internal Next.js hydration payload.

  smartrecruiters:
    delay_seconds: 10.0
    max_concurrency: 2
    notes: Known to throw aggressive 429 errors.

  teamtailor:
    delay_seconds: 5.0
    max_concurrency: 2
    notes: Strictly enforces 50 requests per 10 seconds.

  bamboohr:
    delay_seconds: 15.0
    max_concurrency: 1
    notes: Unpredictable public limits. Keep execution linear.

  icims:
    delay_seconds: 30.0
    max_concurrency: 1
    notes: Enterprise portal; session management required.

  workday:
    delay_seconds: 60.0
    max_concurrency: 1
    notes: High risk of tenant blocks. Needs significant padding.

  oracle:
    delay_seconds: 60.0
    max_concurrency: 1
    notes: Enterprise structure. Avoid parallel requests.

  successfactors:
    delay_seconds: 60.0
    max_concurrency: 1
    notes: SAP infrastructure; slow response handling.

  phenom:
    delay_seconds: 60.0
    max_concurrency: 1
    notes: Heavy script/payload architectures.

  avature:
    delay_seconds: 60.0
    max_concurrency: 1
    notes: Legacy enterprise setups.

  eightfold:
    delay_seconds: 60.0
    max_concurrency: 1
    notes: Dynamic AI-driven portal; sensitive to bot heuristics.

  cornerstone:
    delay_seconds: 60.0
    max_concurrency: 1
    notes: Enterprise target.

  personio:
    delay_seconds: 30.0
    max_concurrency: 1
    notes: European mid-market focus.

  recruitee:
    delay_seconds: 20.0
    max_concurrency: 1
    notes: Lightweight JSON layouts.

  rippling:
    delay_seconds: 30.0
    max_concurrency: 1
    notes: Modern HR systems; tight session tokens.

  workable:
    delay_seconds: 20.0
    max_concurrency: 1
    notes: Employs moderate rate filtering.

  jazzhr:
    delay_seconds: 30.0
    max_concurrency: 1
    notes: Standard SME board.

  breezy:
    delay_seconds: 30.0
    max_concurrency: 1
    notes: Straightforward public structures.

  pinpoint:
    delay_seconds: 30.0
    max_concurrency: 1
    notes: Niche aggregator setup.

  gem:
    delay_seconds: 30.0
    max_concurrency: 1
    notes: Tracks direct applicant loops closely.

  recruiterbox:
    delay_seconds: 30.0
    max_concurrency: 1
    notes: Older platform infrastructure.

  taleo:
    delay_seconds: 60.0
    max_concurrency: 1
    notes: Oracle legacy; highly unstable headers.

  join_com:
    delay_seconds: 30.0
    max_concurrency: 1
    notes: Modern digital interface.

