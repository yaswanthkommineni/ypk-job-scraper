# Location alias groups.
# Same shape as skill_aliases.yml so the matcher can reuse one walker:
#
#   locations:
#     <region>:
#       <canonical_location>:
#         - alias1
#         - alias2
#
# Conventions (intended; not enforced here):
#   - Aliases are matched case-insensitively against the JD's `location` field
#     (and, secondarily, against the JD body for hints like "based in Bengaluru").
#   - Punctuation/hyphens/multiple-spaces normalized to a single space.
#   - Word-boundary matching (\b...\b) is mandatory to avoid e.g. "sf" inside
#     "transfer". Bare 1-2 letter airport-style codes (sfo, lax, blr) are
#     KEPT — they're safe with word boundaries and routinely appear in JDs.
#   - In profiles.yaml, reference a location as `locations.<region>.<canonical>`
#     (dotted) to avoid collisions across regions.
#
# Scope: India + US California (per user direction). Plus generic "remote/
# hybrid/onsite" work-mode aliases that JDs commonly use.

